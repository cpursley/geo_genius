services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile.postgres
    ports:
      - "54326:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./test:/tests:ro
      - ./database/initdb:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: geo_genius_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust

volumes:
  pgdata:
